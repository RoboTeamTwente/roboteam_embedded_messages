syntax="proto3";

package proto;

message REM_RobotCommand {
    uint32 packetType = 1;    // integer [0, 255]             Byte indicating the type of packet
    uint32 toRobotId = 2;     // integer [0, 15]              Id of the receiving robot
    bool toColor = 3;         // integer [0, 1]               Color of the receiving robot / basestation. Yellow = 0, Blue = 1
    bool toBC = 4;            // integer [0, 1]               Bit indicating this packet has to be broadcasted to all robots
    bool toBS = 5;            // integer [0, 1]               Bit indicating this packet is meant for the basestation
    bool toPC = 6;            // integer [0, 1]               Bit indicating this packet is meant for the PC
    uint32 fromRobotId = 7;   // integer [0, 15]              Id of the transmitting robot
    bool fromColor = 8;       // integer [0, 1]               Color of the transmitting robot / basestation. Yellow = 0, Blue = 1
    bool reserved = 9;        // integer [0, 1]               reserved
    bool fromBS = 10;         // integer [0, 1]               Bit indicating this packet is coming from the basestation
    bool fromPC = 11;         // integer [0, 1]               Bit indicating this packet is coming from the PC
    uint32 remVersion = 12;   // integer [0, 15]              Version of roboteam_embedded_messages
    uint32 messageId = 13;    // integer [0, 15]              messageId. Can be used for aligning packets
    uint64 timestamp = 14;    // integer [0, 281474976710655] Unix Timestamp in milliseconds
    uint32 payloadSize = 15;  // integer [0, 255]             Size of the payload. At most 255 bytes including the generic_packet_header. Keep the 127 byte SX1280 limit in mind
    float rho = 16;           // float   [0.000, 30.000]      Magnitude of movement (m/s)
    float theta = 17;         // float   [-3.142, 3.142]      Direction of movement (radians)
    float yaw = 18;           // float   [-3.142, 3.142]      Absolute facing angle (rad)
    float angularVelocity = 19; // float   [-31.416, 31.416]    Angular velocity (rad/s)
    float cameraYaw = 20;     // float   [-3.142, 3.142]      Angle of the robot as seen by camera (rad)
    float acceleration_magnitude = 21; // float   [-15.000, 15.000]    Magnitude of acceleration (m/s^2)
    float acceleration_angle = 22; // float   [-3.142, 3.142]      Angle of acceleration (rad)
    float kickChipPower = 23; // float   [0.000, 8.000]       Speed of the ball in m/s
    bool doKick = 24;         // integer [0, 1]               Do a kick if ballsensor
    bool doChip = 25;         // integer [0, 1]               Do a chip if ballsensor
    bool kickAtYaw = 26;      // integer [0, 1]               Do a kick once yaw is reached
    bool doForce = 27;        // integer [0, 1]               Do regardless of ballsensor
    bool useCameraYaw = 28;   // integer [0, 1]               Use the info in 'cameraYaw'
    bool useYaw = 29;         // integer [0, 1]               0 = angular velocity, 1 = yaw
    bool dribblerOn = 30;     // integer [0, 1]               Dribbler on/off
    bool dribblerOption1 = 31; // integer [0, 1]               Dribbler option 1
    bool dribblerOption2 = 32; // integer [0, 1]               Dribbler option 2
    bool dribblerOption3 = 33; // integer [0, 1]               Dribbler option 3
    bool dribblerOption4 = 34; // integer [0, 1]               Dribbler option 4
    bool dribblerOption5 = 35; // integer [0, 1]               Dribbler option 5
    bool dribblerOption6 = 36; // integer [0, 1]               Dribbler option 6
    bool sendStateInfo = 37;  // integer [0, 1]               Indicate if stateInfo should be send back
    bool wheelsOff = 38;      // integer [0, 1]               Indicate that the robot should stop moving
    bool reboot = 39;         // integer [0, 1]               Reboot the robot remotely
}
