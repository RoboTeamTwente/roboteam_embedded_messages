syntax="proto3";

package proto;

message REM_RobotStateInfo {
    uint32 packetType = 1;    // integer [0, 255]             Byte indicating the type of packet
    uint32 toRobotId = 2;     // integer [0, 15]              Id of the receiving robot
    bool toColor = 3;         // integer [0, 1]               Color of the receiving robot / basestation. Yellow = 0, Blue = 1
    bool toBC = 4;            // integer [0, 1]               Bit indicating this packet has to be broadcasted to all robots
    bool toBS = 5;            // integer [0, 1]               Bit indicating this packet is meant for the basestation
    bool toPC = 6;            // integer [0, 1]               Bit indicating this packet is meant for the PC
    uint32 fromRobotId = 7;   // integer [0, 15]              Id of the transmitting robot
    bool fromColor = 8;       // integer [0, 1]               Color of the transmitting robot / basestation. Yellow = 0, Blue = 1
    bool reserved = 9;        // integer [0, 1]               reserved
    bool fromBS = 10;         // integer [0, 1]               Bit indicating this packet is coming from the basestation
    bool fromPC = 11;         // integer [0, 1]               Bit indicating this packet is coming from the PC
    uint32 remVersion = 12;   // integer [0, 15]              Version of roboteam_embedded_messages
    uint32 messageId = 13;    // integer [0, 15]              messageId. Can be used for aligning packets
    uint64 timestamp = 14;    // integer [0, 281474976710655] Unix Timestamp in milliseconds
    uint32 payloadSize = 15;  // integer [0, 255]             Size of the payload. At most 255 bytes including the generic_packet_header. Keep the 127 byte SX1280 limit in mind
    float xsensAcc1 = 16;     // float   [-100.000, 100.000]  xsensAcc1
    float xsensAcc2 = 17;     // float   [-100.000, 100.000]  xsensAcc2
    float xsensYaw = 18;      // float   [-50000.000, 50000.000] xsensYaw
    float rateOfTurn = 19;    // float   [-20.000, 20.000]    rateOfTurn
    float wheelSpeed1 = 20;   // float   [-1000.000, 1000.000] wheelSpeed1
    float wheelSpeed2 = 21;   // float   [-1000.000, 1000.000] wheelSpeed2
    float wheelSpeed3 = 22;   // float   [-1000.000, 1000.000] wheelSpeed3
    float wheelSpeed4 = 23;   // float   [-1000.000, 1000.000] wheelSpeed4
    float dribbleSpeed = 24;  // float   [0.000, 5000.000]    dribblerSpeed
    float filteredDribbleSpeed = 25; // float   [0.000, 5000.000]    filtered dribblerSpeed
    float dribblespeedBeforeGotBall = 26; // float   [0.000, 5000.000]    dribblerSpeed at at the time dribbler thinks it got the ball
    float bodyControllerRef_u = 27; // float   [-100.000, 100.000]  Reference speed body velocity u
    float bodyControllerRef_v = 28; // float   [-100.000, 100.000]  Reference speed body velocity v
    float bodyControllerRef_w = 29; // float   [-100.000, 100.000]  Reference speed body velocity w
    float bodyControllerRef_yaw = 30; // float   [-3.142, 3.142]      Reference speed body velocity yaw
    float wheelSpeedRef1 = 31; // float   [-2500.000, 2500.000] Reference speed of Wheel_1
    float wheelSpeedRef2 = 32; // float   [-2500.000, 2500.000] Reference speed of Wheel_2
    float wheelSpeedRef3 = 33; // float   [-2500.000, 2500.000] Reference speed of Wheel_3
    float wheelSpeedRef4 = 34; // float   [-2500.000, 2500.000] Reference speed of Wheel_4
    float bodyController_u = 35; // float   [-100.000, 100.000]  Body u controller output
    float bodyController_v = 36; // float   [-100.000, 100.000]  Body v controller output
    float bodyController_w = 37; // float   [-100.000, 100.000]  Body w controller output
    float bodyController_yaw = 38; // float   [-3.142, 3.142]      Body yaw controller output
    uint32 kickerVoltage = 39; // integer [0, 1023]            Capacitor voltage
